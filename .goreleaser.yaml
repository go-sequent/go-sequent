# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: go-sequent

before:
  hooks:
    - go mod tidy

builds:
  - id: go-sequent
    main: ./cmd/go-sequent
    binary: go-sequent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  # Private repo: GitHub Release via GITHUB_TOKEN (no extra secrets).
  draft: false
  prerelease: auto
